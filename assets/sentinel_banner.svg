<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0d131f" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#10b981" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Terminal Box Gradient -->
    <linearGradient id="terminalBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05080f" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#090e18" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="896" height="316" rx="14" fill="url(#bgGradient)" stroke="url(#borderGlow)" stroke-width="1.5" />

  <!-- Subtle Cyber Grid -->
  <g opacity="0.07" stroke="#00f0ff" stroke-width="0.75">
    <line x1="50" y1="0" x2="50" y2="320" />
    <line x1="150" y1="0" x2="150" y2="320" />
    <line x1="250" y1="0" x2="250" y2="320" />
    <line x1="350" y1="0" x2="350" y2="320" />
    <line x1="450" y1="0" x2="450" y2="320" />
    <line x1="550" y1="0" x2="550" y2="320" />
    <line x1="650" y1="0" x2="650" y2="320" />
    <line x1="750" y1="0" x2="750" y2="320" />
    <line x1="850" y1="0" x2="850" y2="320" />
    <line x1="0" y1="50" x2="900" y2="50" />
    <line x1="0" y1="110" x2="900" y2="110" />
    <line x1="0" y1="170" x2="900" y2="170" />
    <line x1="0" y1="230" x2="900" y2="230" />
    <line x1="0" y1="290" x2="900" y2="290" />
  </g>

  <!-- ================= LEFT HEADER & BRANDING ================= -->
  <g transform="translate(35, 45)">
    <!-- Security Shield Icon -->
    <path d="M 0 6 L 14 0 L 28 6 L 28 16 C 28 25 14 32 14 32 C 14 32 0 25 0 16 Z" fill="none" stroke="#00f0ff" stroke-width="2" filter="url(#glow)" />
    <path d="M 14 8 L 20 14 L 14 24 L 8 14 Z" fill="#10b981" opacity="0.8" />
    
    <text x="40" y="16" fill="#f8fafc" font-size="20" font-weight="800" letter-spacing="3" class="font-mono">CRYPTO SENTINEL</text>
    <text x="40" y="30" fill="#10b981" font-size="10" font-weight="700" letter-spacing="2" class="font-mono">AUTONOMOUS QUANTITATIVE EXECUTION &amp; RISK ENGINE</text>
  </g>

  <!-- Live Status Badge (Top Right) -->
  <g transform="translate(670, 42)">
    <rect x="0" y="0" width="195" height="26" rx="13" fill="#0b1322" stroke="#10b981" stroke-width="1.2" />
    <circle cx="16" cy="13" r="4.5" fill="#10b981" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="17" fill="#10b981" font-size="10" font-weight="800" letter-spacing="1" class="font-mono">79.2% WIN RATE // VERIFIED</text>
  </g>

  <!-- ================= TERMINAL SAMPLE LOG WINDOW ================= -->
  <g transform="translate(35, 95)">
    <!-- Window Frame -->
    <rect x="0" y="0" width="540" height="195" rx="10" fill="url(#terminalBg)" stroke="#1e293b" stroke-width="1.2" />
    
    <!-- Top Bar -->
    <rect x="0" y="0" width="540" height="28" rx="10" fill="#0d1424" />
    <circle cx="16" cy="14" r="4" fill="#ef4444" opacity="0.8" />
    <circle cx="30" cy="14" r="4" fill="#f59e0b" opacity="0.8" />
    <circle cx="44" cy="14" r="4" fill="#10b981" opacity="0.8" />
    <text x="65" y="18" fill="#64748b" font-size="10" font-weight="600" class="font-mono">daemon://sentinel-core.log</text>

    <!-- Realistic Daemon Output Logs (Static clean layout: no overlapping CSS transforms) -->
    <g class="font-mono" font-size="10.5">
      <!-- Line 1 -->
      <text x="18" y="52">
        <tspan fill="#64748b">18:30:02</tspan>
        <tspan fill="#38bdf8" font-weight="700"> [INFO]</tspan>
        <tspan fill="#94a3b8"> Market feeds synchronized: </tspan>
        <tspan fill="#10b981" font-weight="700">BYBIT / BINANCE (OK)</tspan>
      </text>

      <!-- Line 2 -->
      <text x="18" y="74">
        <tspan fill="#64748b">18:30:05</tspan>
        <tspan fill="#38bdf8" font-weight="700"> [INFO]</tspan>
        <tspan fill="#94a3b8"> Order book scanner engaged: </tspan>
        <tspan fill="#00f0ff" font-weight="700">BTC, ETH, SOL, XAU</tspan>
      </text>

      <!-- Line 3 -->
      <text x="18" y="96">
        <tspan fill="#64748b">18:30:12</tspan>
        <tspan fill="#a78bfa" font-weight="700"> [AUDIT]</tspan>
        <tspan fill="#94a3b8"> Confluence criteria satisfied </tspan>
        <tspan fill="#a78bfa" font-weight="700">(Score: 89.2% &gt; 85.5%)</tspan>
      </text>

      <!-- Line 4 -->
      <text x="18" y="118">
        <tspan fill="#64748b">18:30:15</tspan>
        <tspan fill="#10b981" font-weight="700"> [ARMOR]</tspan>
        <tspan fill="#94a3b8"> Capital preservation check: </tspan>
        <tspan fill="#10b981" font-weight="700">0.00% DD (Circuit OK)</tspan>
      </text>

      <!-- Line 5 -->
      <text x="18" y="140">
        <tspan fill="#64748b">18:30:18</tspan>
        <tspan fill="#f59e0b" font-weight="700"> [DISPATCH]</tspan>
        <tspan fill="#f8fafc" font-weight="700"> Signal sent ➔ Telegram </tspan>
        <tspan fill="#10b981" font-weight="700">[SL &amp; TP Armed]</tspan>
      </text>

      <!-- Line 6 (Listening daemon prompt with blinking cursor) -->
      <text x="18" y="164">
        <tspan fill="#38bdf8" font-weight="700">❯ </tspan>
        <tspan fill="#64748b">sentinel daemon listening for market ticks... </tspan>
        <tspan fill="#10b981">█<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" /></tspan>
      </text>
    </g>
  </g>

  <!-- ================= RIGHT RADAR & ASSET SCANNER ================= -->
  <g transform="translate(745, 192)">
    <!-- Radar Base Glow -->
    <circle cx="0" cy="0" r="85" fill="#040711" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="0" cy="0" r="60" fill="none" stroke="#0f172a" stroke-width="1" stroke-dasharray="4 3" />
    <circle cx="0" cy="0" r="35" fill="none" stroke="#00f0ff" stroke-width="0.8" opacity="0.3" />
    <circle cx="0" cy="0" r="10" fill="#10b981" opacity="0.4" />

    <!-- Crosshair axes -->
    <line x1="-85" y1="0" x2="85" y2="0" stroke="#1e293b" stroke-width="1" />
    <line x1="0" y1="-85" x2="0" y2="85" stroke="#1e293b" stroke-width="1" />

    <!-- Sweeping Radar Beam (Rotating Animation) -->
    <g>
      <path d="M 0 0 L 85 0 A 85 85 0 0 0 0 -85 Z" fill="url(#radarSweep)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite" />
      </path>
    </g>

    <!-- ================= SCANNED ASSET BADGES ================= -->
    <!-- 1. BTC (Top-Right Quadrant) -->
    <g transform="translate(38, -34)">
      <rect x="-18" y="-10" width="36" height="20" rx="10" fill="#181308" stroke="#f59e0b" stroke-width="1.2">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" />
      </rect>
      <circle cx="-9" cy="0" r="3" fill="#f59e0b" filter="url(#glow)" />
      <text x="3" y="4" text-anchor="middle" fill="#fbbf24" font-size="9" font-weight="800" class="font-mono">BTC</text>
    </g>

    <!-- 2. ETH (Top-Left Quadrant) -->
    <g transform="translate(-40, -32)">
      <rect x="-18" y="-10" width="36" height="20" rx="10" fill="#0d1428" stroke="#6366f1" stroke-width="1.2">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.4s" repeatCount="indefinite" />
      </rect>
      <circle cx="-9" cy="0" r="3" fill="#6366f1" filter="url(#glow)" />
      <text x="3" y="4" text-anchor="middle" fill="#818cf8" font-size="9" font-weight="800" class="font-mono">ETH</text>
    </g>

    <!-- 3. SOL (Bottom-Right Quadrant) -->
    <g transform="translate(38, 36)">
      <rect x="-18" y="-10" width="36" height="20" rx="10" fill="#1b0e2b" stroke="#a855f7" stroke-width="1.2">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" />
      </rect>
      <circle cx="-9" cy="0" r="3" fill="#a855f7" filter="url(#glow)" />
      <text x="3" y="4" text-anchor="middle" fill="#c084fc" font-size="9" font-weight="800" class="font-mono">SOL</text>
    </g>

    <!-- 4. XAU (Gold, Bottom-Left Quadrant) -->
    <g transform="translate(-40, 36)">
      <rect x="-18" y="-10" width="36" height="20" rx="10" fill="#201a06" stroke="#eab308" stroke-width="1.2">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite" />
      </rect>
      <circle cx="-9" cy="0" r="3" fill="#eab308" filter="url(#glow)" />
      <text x="3" y="4" text-anchor="middle" fill="#fde047" font-size="9" font-weight="800" class="font-mono">XAU</text>
    </g>

    <!-- Bottom Radar Caption -->
    <text x="0" y="105" text-anchor="middle" fill="#10b981" font-size="9" font-weight="800" letter-spacing="1.5" class="font-mono">RADAR: BTC • ETH • SOL • XAU</text>
  </g>
</svg>
